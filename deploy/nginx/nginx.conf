# Bastion edge proxy. Runs unprivileged (UID 101), read-only root filesystem, tmpfs for /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    charset utf-8;
    sendfile on;
    tcp_nopush on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Structured access log. Query strings are NOT logged ($uri, not $request_uri): WS tickets live there.
    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
                                '"rid":"$sent_http_x_request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    # --- DoS / slowloris defences (coarse; the app enforces fine-grained, per-account limits)
    client_body_timeout   15s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     15s;
    client_max_body_size  64k;
    large_client_header_buffers 4 8k;
    limit_req_zone  $binary_remote_addr zone=per_ip:20m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth_ip:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream bastion_api { server api:8000; keepalive 32; }

    server {
        listen 8080 default_server;
        server_name _;
        # Plain HTTP only redirects; nothing is served.
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;   # Host is validated by the app (ALLOWED_HOSTS)

        ssl_certificate     /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_timeout 1d;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        limit_conn conn_ip 50;
        root /usr/share/bastion;

        # Never serve dotfiles / backups.
        location ~ /\. { return 404; }

        location /assets/ {
            include /etc/nginx/snippets/security_headers.conf;
            add_header Content-Security-Policy "default-src 'none'" always;
            add_header Cache-Control "no-cache" always;   # unhashed filenames: revalidate via ETag
            try_files $uri =404;
        }

        # The single-page app shell (strict CSP + Trusted Types).
        location = /admin { include /etc/nginx/snippets/spa_headers.conf; add_header Cache-Control "no-cache" always; try_files /admin.html =404; }
        location /admin/ { include /etc/nginx/snippets/spa_headers.conf; add_header Cache-Control "no-cache" always; try_files /admin.html =404; }
        location / {
            include /etc/nginx/snippets/spa_headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        # --- API
        location /api/ {
            limit_req zone=per_ip burst=60 nodelay;
            proxy_pass http://bastion_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Overwrite (never append) X-Forwarded-For: the app trusts exactly one hop, this proxy.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header X-Powered-By;
            proxy_read_timeout 30s;
        }
        location ~ ^/api/v1/auth/(login|register|password-reset|passkey|verify-email) {
            limit_req zone=auth_ip burst=10 nodelay;
            proxy_pass http://bastion_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /api/v1/media {
            client_max_body_size 100m;
            proxy_request_buffering off;   # the app streams, counts and sniffs the body itself
            proxy_pass http://bastion_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 120s;
        }
        location = /api/v1/ws {
            limit_req zone=auth_ip burst=20 nodelay;
            proxy_pass http://bastion_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 300s;
        }

        # --- Admin API. Optionally restrict to a VPN / office range (defence in depth):
        location /admin/api/ {
            # include /etc/nginx/snippets/admin_allowlist.conf;   # allow 10.8.0.0/16; deny all;
            limit_req zone=per_ip burst=20 nodelay;
            proxy_pass http://bastion_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --- Media: only reachable via X-Accel-Redirect after the app authorised the request.
        location /_protected_media/ {
            internal;
            alias /srv/media/;
            types { }
            default_type application/octet-stream;   # the app's Content-Type (webp/mp4) is passed through
            include /etc/nginx/snippets/security_headers.conf;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cache-Control "private, max-age=300" always;
            add_header Vary "Cookie, Authorization" always;
        }
    }
}
