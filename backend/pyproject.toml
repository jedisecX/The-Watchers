[project]
name = "bastion"
version = "1.0.0"
description = "Security-first social network"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:.*httpx.*:Warning",
]
markers = ["slow: slow tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "I", "UP", "BLE"]
ignore = ["B008", "E731", "S311", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE"]
"migrations/*" = ["E501", "I"]
"app/api/*" = ["E501"]  # endpoint tables in module docstrings
"app/models.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
